# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

# vim:fileencoding=utf-8

# : Manager

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }

# Find
find_keyword  = { fg = "#df8e1d", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.tertiary.default.hex}}", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#40a02b", bg = "#40a02b" }
marker_cut      = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "#df8e1d", bg = "#df8e1d" }

# Count
count_copied   = { fg = "{{colors.on_primary.default.hex}}", bg = "#40a02b" }
count_cut      = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_primary.default.hex}}", bg = "#df8e1d" }

# Border
border_symbol = "│"
border_style  = { fg = "{{colors.outline.default.hex}}" }


# : Tabs

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface.default.hex}}" }


# : Mode

[mode]

normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface.default.hex}}" }

# Select mode
select_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.surface.default.hex}}" }

# Unset mode
unset_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface.default.hex}}" }


# : Status bar

[status]
# Permissions
perm_sep   = { fg = "{{colors.outline.default.hex}}" }
perm_type  = { fg = "{{colors.primary.default.hex}}" }
perm_read  = { fg = "#df8e1d" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec  = { fg = "#40a02b" }

# Progress
progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "#40a02b", bg = "{{colors.surface.default.hex}}" }
progress_error  = { fg = "#df8e1d", bg = "{{colors.error.default.hex}}" }


# : Pick

[pick]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.tertiary.default.hex}}", bold = true }
inactive = {}


# : Input

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = {}
value    = {}
selected = { reversed = true }


# : Completion

[cmp]
border = { fg = "{{colors.primary.default.hex}}" }


# : Tasks

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = {}
hovered = { fg = "{{colors.tertiary.default.hex}}", bold = true }


# : Which

[which]
border          = { fg = "{{colors.primary.default.hex}}" }
cand            = { fg = "{{colors.secondary.default.hex}}" }
rest            = { fg = "{{colors.outline.default.hex}}" }
desc            = { fg = "{{colors.tertiary.default.hex}}" }
separator       = "  "
separator_style = { fg = "{{colors.outline.default.hex}}" }


# : Help

[help]
on      = { fg = "{{colors.secondary.default.hex}}" }
run     = { fg = "{{colors.tertiary.default.hex}}" }
hovered = { reversed = true, bold = true }
footer  = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.on_surface.default.hex}}" }


# : Spotter

[spot]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
tbl_col  = { fg = "{{colors.secondary.default.hex}}" }
tbl_cell = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface.default.hex}}" }


# : Notification

[notify]
title_info  = { fg = "#40a02b" }
title_warn  = { fg = "#df8e1d" }
title_error = { fg = "{{colors.error.default.hex}}" }


# : File-specific styles

[filetype]

rules = [
	# Image
	{ mime = "**/image/*", fg = "{{colors.secondary.default.hex}}" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#df8e1d" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{colors.tertiary.default.hex}}" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#40a02b" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "{{colors.outline.default.hex}}" },
	# Fallback
	{ url = "*", fg = "{{colors.tertiary.default.hex}}" },
	{ url = "*/", fg = "{{colors.primary.default.hex}}" },

]

[icon]

dirs = [
	{ name = ".config", text = "", fg = "{{colors.tertiary.default.hex}}" },
	{ name = ".git", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = ".github", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = ".npm", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Desktop", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = "Development", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = "Documents", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = "Downloads", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = "Library", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = "Movies", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = "Music", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = "Pictures", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = "Public", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = "Videos", text = "", fg = "{{colors.secondary.default.hex}}" },
	{ name = "*/", fg = "{{colors.secondary.dark.hex}}" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "{{colors.on_surface.default.hex}}" },
	{ if = "link", text = "", fg = "{{colors.outline.default.hex}}" },
	{ if = "block", text = "", fg = "#{{colors.error.default.hex}}" },
	{ if = "char", text = "", fg = "#{{colors.error.default.hex}}" },
	{ if = "fifo", text = "", fg = "#{{colors.error.default.hex}}" },
	{ if = "sock", text = "", fg = "#{{colors.error.default.hex}}" },
	{ if = "sticky", text = "", fg = "#{{colors.error.default.hex}}" },
	{ if = "dummy", text = "", fg = "{{colors.error.default.hex}}" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "{{colors.primary.default.hex}}" },
	{ if = "dir", text = "", fg = "{{colors.primary.default.hex}}" },
	{ if = "exec", text = "", fg = "#40a02b" },
	{ if = "!dir", text = "", fg = "{{colors.on_surface.default.hex}}" },
]
