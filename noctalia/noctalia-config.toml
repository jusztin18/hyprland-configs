[accessibility]
ui_scale = 1.2

[bar]
order = [ "bar", "default" ]

    [bar.bar]
    background_opacity = 0.0
    capsule_opacity = 0.59999998658895493
    center = [ "workspaces" ]
    enabled = true
    end = [ "group:g3", "spacer_7", "group:g2", "spacer_5", "session" ]
    margin_ends = 25
    padding = 0
    scale = 1.300000011920929
    start = [ "clock", "spacer_3", "group:g1", "spacer_2", "weather" ]
    thickness = 40

        [[bar.bar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "ram" ]
        opacity = 0.40000000596046448
        padding = 6.0
        widget_spacing = 10

        [[bar.bar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "notifications", "network", "volume", "brightness" ]
        opacity = 0.60000002384185791
        padding = 10.0
        widget_spacing = 15

        [[bar.bar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "wallhaven", "tray" ]
        opacity = 0.60000002384185791
        padding = 10.0

    [bar.default]
    center = [ "workspaces", "spacer_1", "active_window" ]
    concave_edge_corners = true
    enabled = false
    end = [ "media", "spacer_1", "tray", "notifications", "network", "volume", "session" ]
    margin_edge = 0
    margin_ends = 0
    radius_bottom_left = 12
    radius_bottom_right = 12
    radius_top_left = 0
    radius_top_right = 0
    reserve_space = false
    scale = 1.1000000000000001
    smart_auto_hide = true
    start = [ "launcher", "clock", "spacer_1", "group:g1" ]
    thickness = 35

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = ""
        border_width = 1.0
        enabled = true
        fill = "primary"
        foreground = "secondary"
        id = "g1"
        members = [ "temp", "sysmon_2", "sysmon_3" ]
        opacity = 1.0
        padding = 6.0

[brightness]
enable_ddcutil = true

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
