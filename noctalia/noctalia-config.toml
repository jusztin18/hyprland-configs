[nightlight]
enabled = true

[osd.kinds]
bluetooth = false
wifi = false

[plugin_settings."noctalia/wallhaven"]
download_dir = "/home/justin/Pictures/wallpapers"

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
password_style = "random"
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screen_corners]
    enabled = true
    size = 20

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Noctalia"
community_palette = "GitHub Dark"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "discord", "telegram", "libreoffice", "micro", "vscode", "steam", "fastfetch", "yazi" ]

        [theme.templates.user.yazi]
        input_path = "$XDG_CONFIG_HOME/.config/noctalia/templates/yazi.toml"
        output_path = "$XDG_CONFIG_HOME/.config/yazi/theme.toml"
        post_hook = ""

[wallpaper]
directory = "/home/justin/Pictures/wallpapers"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/justin/Pictures/wallpapers/wallhaven-0qgmp7.jpg"

    [wallpaper.last]
    path = "/home/justin/Pictures/wallpapers/wallhaven-0qgmp7.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/justin/Pictures/wallpapers/wallhaven-0qgmp7.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/justin/Pictures/wallpapers/wallhaven-0qgmp7.jpg"

[widget.brightness]
capsule = true
capsule_opacity = 0.59999999999999998
color = "primary"

[widget.clock]
capsule = true
capsule_opacity = 0.5
color = "primary"
format = "{:%d/%m/%Y %A %H:%M }"

[widget.cpu]
capsule = true
capsule_border_width = 2.0
capsule_opacity = 0.59999999999999998
capsule_radius = "auto"
color = "primary"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
capsule = true
capsule_opacity = 0.59999999999999998
color = "primary"

[widget.notifications]
capsule = true
capsule_opacity = 0.59999999999999998
color = "primary"

[widget.ram]
capsule = true
capsule_opacity = 0.59999999999999998
color = "primary"

[widget.session]
capsule = true
capsule_fill = "surface_variant"
capsule_opacity = 0.5
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_5]
type = "spacer"

[widget.spacer_7]
type = "spacer"

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.temp]
show_value = false

[widget.tray]
capsule = true
capsule_fill = "surface_variant"
capsule_foreground = "primary"
capsule_opacity = 0.59999999999999998
color = "primary"
icon_color = "primary"

[widget.volume]
capsule = true
capsule_opacity = 0.59999999999999998
color = "primary"

[widget.wallhaven]
capsule = true
capsule_fill = "surface_variant"
capsule_opacity = 0.59999999999999998
capsule_padding = 8
capsule_radius = "auto"
color = "primary"
type = "noctalia/wallhaven:wallhaven"

[widget.weather]
capsule = true
capsule_foreground = "secondary"
capsule_opacity = 0.40000000000000002
capsule_padding = 10
color = "primary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
capsule_opacity = 0.59999999999999998
empty_color = "tertiary"
inactive_pill_size = 1.0
pill_scale = 0.80000000000000004
show_labels = false
